name: Fetch images and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch images
        if: hashFiles('images/20_c.jpg') == ''
        env:
          IMAGES_URL: https://litter.catbox.moe/4cpd59.tgz
          IMAGES_SHA256: 21331f89c6f772ed387a6b938f601e0ce70ae3be63bfc828a78143d8817d0a2e
        run: |
          curl -fsSL --retry 5 -A "Mozilla/5.0" -o images.tgz "$IMAGES_URL"
          echo "$IMAGES_SHA256  images.tgz" | sha256sum -c -
          tar xzf images.tgz
          rm images.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "chore: add room images"
          git push origin HEAD:main

      - name: Update gh-pages
        run: |
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git push --force origin HEAD:gh-pages
          fi
